<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAP check</title>
<style>body{font-family:system-ui;padding:16px;max-width:560px;margin:auto}.r{padding:10px;margin:8px 0;border-radius:8px;background:#eee}.ok{background:#d4f5dd}.bad{background:#fbd5d5}button{padding:12px 16px;font-size:16px}</style></head><body>
<h3>TAP connection check</h3><div id="out"></div><button id="nfc">Start NFC test</button><div id="log"></div>
<script>
const out=document.getElementById('out'),log=document.getElementById('log');
const row=(ok,t)=>{const d=document.createElement('div');d.className='r '+(ok?'ok':'bad');d.textContent=(ok?'OK: ':'PROBLEM: ')+t;out.appendChild(d)};
row(true,'Address: '+location.href);
row(location.protocol!=='file:','Opened through a server (not file://)');
row(window.isSecureContext,'Secure context (needed for NFC): '+window.isSecureContext+(window.isSecureContext?'':' -> set the Chrome flag for this address, see SETUP'));
row('NDEFReader' in window,'Web NFC available in this browser: '+('NDEFReader' in window)+('NDEFReader' in window?'':' -> use Chrome on Android, with NFC turned on'));
fetch('sync.php?t='+Date.now()).then(r=>r.text()).then(t=>{let ok=false;try{ok=JSON.parse(t).hasOwnProperty('rev')}catch(e){}row(ok,'sync.php replied: '+t.slice(0,80))}).catch(e=>row(false,'Cannot reach sync.php: '+e.message));
document.getElementById('nfc').onclick=async()=>{try{const n=new NDEFReader();await n.scan();log.innerHTML='<div class="r ok">Listening. Tap a card on the back of the phone...</div>';
n.onreading=e=>log.innerHTML+='<div class="r ok">CARD READ. UID: '+e.serialNumber+'</div>';
n.onreadingerror=()=>log.innerHTML+='<div class="r bad">A tag was detected but cannot be read (unsupported card type)</div>'}catch(e){log.innerHTML='<div class="r bad">'+e.name+': '+e.message+'</div>'}};
</script></body></html>
