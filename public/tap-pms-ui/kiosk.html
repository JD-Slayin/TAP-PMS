<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAP Kiosk</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
  <style>
@font-face { font-family: 'Inter'; src: url('vendor/fonts/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
:root { --navy: #12263f; --navy-2: #1a3454; --line: #2c4666; --brass: #b08a2e; --muted: #9fb2cb; }
body { background: var(--navy); color: #fff; min-height: 100vh; display: flex; flex-direction: column; font-family: 'Inter', system-ui, sans-serif; user-select: none; }
.k-head { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; border-bottom: 3px solid var(--brass); }
.k-brand { display: flex; align-items: center; gap: .85rem; }
.tap-wordmark { font-weight: 800; letter-spacing: .12em; font-size: 1.3rem; line-height: 1; }
.k-main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.5rem; padding: 1.5rem 2rem 2rem; align-items: stretch; }
.k-panel { background: var(--navy-2); border: 1px solid var(--line); border-radius: 4px; }
.k-clock { padding: 2rem 2rem 1.25rem; border-bottom: 1px solid var(--line); }
.digital-clock { font-size: 4.5rem; font-weight: 700; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.k-date { color: var(--muted); font-size: 1.1rem; margin-top: .5rem; }
.scan-target { min-height: 300px; display: flex; align-items: center; padding: 2rem; border-left: 5px solid transparent; transition: border-color .2s, background-color .2s; }
.scan-target.state-in { border-left-color: #3fae7a; background: rgba(63,174,122,.08); }
.scan-target.state-out { border-left-color: #d99a2b; background: rgba(217,154,43,.08); }
.photo-frame { width: 96px; height: 96px; object-fit: cover; border: 2px solid #fff; }
.k-panel h2 { font-size: 1.6rem; font-weight: 700; margin: 0 0 1rem; }
.k-input { max-width: 340px; }
.pulse { position: relative; width: 120px; height: 120px; flex: none; display: grid; place-items: center; font-size: 2.6rem; color: var(--brass); }
.pulse::before, .pulse::after { content: ""; position: absolute; inset: 0; border: 2px solid var(--brass); border-radius: 50%; animation: wave 2.6s ease-out infinite; }
.pulse::after { animation-delay: 1.3s; }
.pulse i { position: relative; width: 76px; height: 76px; display: grid; place-items: center; border-radius: 50%; background: rgba(176,138,46,.16); border: 1px solid var(--brass); }
@keyframes wave { from { transform: scale(.65); opacity: .9; } to { transform: scale(1.15); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
.pulse::before, .pulse::after { animation: none; opacity: .4; }
}
.k-clock { background: linear-gradient(90deg, #12263f 0, var(--navy-2) 100%); }
.k-panel { box-shadow: 0 12px 32px rgba(0,0,0,.28); }
.k-input .form-control { background: #0f2036; border-color: var(--line); color: #fff; }
.k-input .form-control::placeholder { color: #6b819e; }
.k-input .btn-primary { background: var(--brass); border-color: var(--brass); color: #12263f; font-weight: 700; }
.k-status { font-size: .8rem; color: var(--muted); min-height: 1.2em; margin-top: .5rem; }
.cam-preview { width: 160px; aspect-ratio: auto 4 / 3; object-fit: cover; transform: scaleX(-1); background: #000; }
@media (max-width: 991px) {
.k-main { grid-template-columns: 1fr; padding: 1rem; }
.k-head { padding: .85rem 1rem; }
.digital-clock { font-size: 3.2rem; }
.k-clock { padding: 1.25rem 1.25rem 1rem; }
.scan-target { min-height: 0; padding: 1rem; }
/* phone: camera is the first thing in the panel and takes the full width */
.idle-row { display: block !important; }
.pulse { display: none; }
.idle-body { display: flex; flex-direction: column; }
.cam-row { display: contents !important; }
.cam-preview { order: -1; width: 200px; max-width: 70%; max-height: 32vh; align-self: center; margin-bottom: .85rem; }
.idle-body h2 { font-size: 1.35rem; margin-bottom: .75rem; }
.k-input { max-width: none; }
#btnEnableNfc { align-self: flex-start; padding: .5rem 1rem; }
}
  </style>
</head>
<body>

  <header class="k-head">
    <div class="k-brand"><span class="tap-wordmark">TAP</span></div>
    <span id="syncBadge" class="badge bg-secondary">Connecting...</span>
  </header>

  <main class="k-main">
    <section class="k-panel">
      <div class="k-clock">
        <div class="digital-clock" id="liveClockDisplay">00:00:00 AM</div>
        <div class="k-date" id="liveDateDisplay"></div>
      </div>

      <div class="scan-target" id="kioskBox">
        <div id="idleDisplay" class="w-100">
          <div class="idle-row d-flex align-items-center gap-4">
          <div class="pulse"><i class="bi bi-broadcast"></i></div>
          <div class="idle-body flex-grow-1">
          <h2>Tap your card</h2>
          <div class="k-input input-group mb-2">
            <input type="text" id="kioskScanBuffer" class="form-control" placeholder="Card UID" autocomplete="off" autofocus>
            <button class="btn btn-primary" type="button" id="btnManualSubmit">Tap</button>
          </div>
          <div class="cam-row d-flex align-items-center gap-3 mt-3">
            <button type="button" class="btn btn-outline-light btn-sm" id="btnEnableNfc">Enable reader</button>
            <video id="camPreview" autoplay playsinline muted class="cam-preview rounded border border-secondary"></video>
          </div>
          <div id="nfcLiveStatus" class="k-status"></div>
          <div id="camStatus" class="k-status mt-0"></div>
          <div id="kioskSuccessCard" class="ks-overlay d-none" aria-live="polite">
            <div class="ks-card">
              <div class="ks-photo-wrap">
                <img id="ksPhoto" src="" alt="">
                <span class="ks-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
              </div>
              <div class="ks-name" id="ksName"></div>
              <div class="ks-meta" id="ksMeta"></div>
              <div class="ks-action" id="ksAction"></div>
              <div class="ks-time" id="ksTime"></div>
              <div class="ks-pill ks-ok" id="ksStatus"></div>
              <div class="ks-date" id="ksDate"></div>
              <div class="ks-sync ks-saving" id="ksSync"></div>
              <div class="ks-bar"><span></span></div>
            </div>
          </div>
          <canvas id="camCanvas" class="d-none"></canvas>
          </div></div>
        </div>

        <div id="verifyDisplay" class="d-none w-100">
          <div class="d-flex align-items-center gap-4">
            <img id="empVerifyImg" src="" class="rounded-circle photo-frame" alt="">
            <div>
              <h2 class="mb-0" id="empVerifyName">--</h2>
              <div class="text-secondary mb-2" id="empVerifyRole">--</div>
              <div class="d-flex gap-2 align-items-center">
                <span class="badge fs-6" id="empVerifyActionBadge"></span>
                <span class="badge fs-6" id="empVerifyStatusBadge"></span>
              </div>
              <div id="verifyNote" class="small mt-2" style="color:#5fd0a0">Recorded</div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div class="modal fade" id="kioskNoticeModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow-lg kiosk-notice"><div class="modal-header border-0 pb-0"><div class="kiosk-notice-icon"><i class="bi bi-info-circle-fill"></i></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body pt-3"><h5 id="kioskNoticeTitle" class="fw-bold mb-2">Notice</h5><p id="kioskNoticeMessage" class="mb-0 text-secondary"></p></div><div class="modal-footer border-0 pt-0"><button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">Okay</button></div></div></div></div>
  <style>
.kiosk-notice {border-radius:18px}
.kiosk-notice-icon {width:44px;height:44px;border-radius:14px;background:#eaf1ff;color:#244c9a;display:grid;place-items:center;font-size:1.25rem}
.k-head .badge {font-size:.8rem;font-weight:600;padding:.5em .9em;border-radius:999px}
.ks-overlay {position:fixed;inset:0;z-index:1040;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(8,18,32,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:ks-fade .18s ease-out}
.ks-overlay.d-none {display:none!important}
.ks-card {position:relative;width:100%;max-width:420px;background:var(--navy-2);border:1px solid var(--line);border-radius:18px;padding:1.75rem 1.5rem 1.6rem;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden;animation:ks-pop .28s cubic-bezier(.2,.9,.3,1.2)}
.ks-card::before {content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--kc,var(--ks))}
.ks-in {--ks:#3fae7a} .ks-out {--ks:#d99a2b} .ks-unsynced {--kc:#e0a030}
.ks-photo-wrap {position:relative;width:112px;height:112px;margin:0 auto 1rem}
.ks-photo-wrap img {width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid var(--ks);background:#0f2036}
.ks-badge {position:absolute;right:-4px;bottom:-4px;width:38px;height:38px;border-radius:50%;background:var(--kc,var(--ks));border:3px solid var(--navy-2);display:grid;place-items:center}
.ks-badge svg {width:22px;height:22px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:ks-draw .4s .15s ease-out forwards}
.ks-name {font-size:1.5rem;font-weight:700;line-height:1.2}
.ks-meta {color:var(--muted);font-size:.95rem;margin-top:.15rem}
.ks-action {margin-top:1.1rem;font-size:.85rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ks)}
.ks-time {font-size:3rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.ks-pill {display:inline-block;margin-top:.5rem;padding:.25rem .85rem;border-radius:999px;font-size:.85rem;font-weight:600}
.ks-ok {background:rgba(63,174,122,.16);color:#6fd6a3} .ks-warn {background:rgba(217,154,43,.18);color:#f0bd5c} .ks-late {background:rgba(224,90,90,.18);color:#ff8f8f}
.ks-date {color:var(--muted);font-size:.85rem;margin-top:.75rem}
.ks-sync {display:flex;align-items:center;justify-content:center;gap:.45rem;margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--line);font-size:.85rem}
.ks-saving {color:var(--muted)} .ks-saved {color:#6fd6a3} .ks-failed {color:#ff8f8f}
.ks-spin {width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--muted);border-radius:50%;animation:ks-rot .7s linear infinite}
.ks-bar {position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(255,255,255,.06)}
.ks-bar span {display:block;height:100%;background:var(--ks);transform-origin:left;animation:ks-bar 3.5s linear forwards}
@keyframes ks-fade {from{opacity:0}to{opacity:1}}
@keyframes ks-pop {from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ks-draw {to{stroke-dashoffset:0}}
@keyframes ks-rot {to{transform:rotate(360deg)}}
@keyframes ks-bar {from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce) {.ks-overlay,.ks-card,.ks-badge svg,.ks-bar span{animation:none}.ks-badge svg{stroke-dashoffset:0}}
  </style>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script>
    function updateKioskClock() {
      const now = new Date();
      document.getElementById('liveClockDisplay').innerText = now.toLocaleTimeString('en-US');
      document.getElementById('liveDateDisplay').innerText = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(updateKioskClock, 1000);
    updateKioskClock();

    const isBlank = v => !v || v === "--";
    window.alert = function(message) {
      const modalEl = document.getElementById('kioskNoticeModal');
      if (!modalEl || !window.bootstrap) { console.warn(message); return; }
      const msg = String(message || 'Please try again.');
      document.getElementById('kioskNoticeTitle').textContent = /too early|window|passed|already recorded/i.test(msg) ? 'Attendance notice' : 'Please note';
      document.getElementById('kioskNoticeMessage').textContent = msg;
      bootstrap.Modal.getOrCreateInstance(modalEl).show();
    };


    // ---------- LIVE PHOTO PROOF (camera) ----------
    const REQUIRE_PHOTO = true;   // true = no camera means no punch. false = allow punch without a picture
    let camStream = null;
    async function startCamera() {
      const el = document.getElementById("camStatus");
      try {
        if (camStream) return true;
        camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
        const v = document.getElementById("camPreview");
        v.srcObject = camStream;
        await v.play();
        el.style.color = "#5fd0a0"; el.innerText = "Camera on";
        return true;
      } catch (err) {
        el.style.color = "#ff8a8a";
        el.innerText = "Camera error: " + err.name;
        return false;
      }
    }
    function capturePhoto() {
      const v = document.getElementById("camPreview");
      if (!camStream || !v.videoWidth) return null;
      const w = 480, h = Math.round(w * v.videoHeight / v.videoWidth);
      const c = document.getElementById("camCanvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.drawImage(v, 0, 0, w, h);
      return c.toDataURL("image/jpeg", 0.6);   // ~30-60KB
    }
    async function uploadPhoto(dataUrl, name) {
      for (let i = 0; i < 3; i++) {
        try {
          const r = await fetch("/api/v1/uploads/attendance-proof", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, data: dataUrl }) });
          const j = await r.json();
          if (j.ok) return j.path;
        } catch (e) {}
        await new Promise(res => setTimeout(res, 500));
      }
      return null;
    }

    async function executePunch(cardUid) {
      if (!cardUid) return;
      const norm = x => String(x || '').replace(/[^0-9a-z]/gi, '').toLowerCase();   // 04:A1:B2 = 04a1b2
      const cleanUid = norm(cardUid);
      const employees = PMSStore.getEmployees();
      const emp = employees.find(e => e.nfcTag && norm(e.nfcTag) === cleanUid);

      if (!emp) {
        alert("Card not registered.");
        return;
      }

      if (emp.status !== "Active") {
        alert(`${emp.name} is ${emp.status}.`);
        return;
      }

      // Resolve the employee schedule effective for this date. HR owns these values.
      const _n = new Date(), _today = _n.getFullYear() + "-" + String(_n.getMonth() + 1).padStart(2, "0") + "-" + String(_n.getDate()).padStart(2, "0");
      const _rec = PMSStore.getDTR().find(r => r.empId === emp.id && r.date === _today);
      const _history = Array.isArray(emp.scheduleHistory) ? emp.scheduleHistory.filter(h => !h.effectiveDate || h.effectiveDate <= _today).sort((a,b) => String(b.effectiveDate||'').localeCompare(String(a.effectiveDate||''))) : [];
      const _sh = _history[0] || emp;
      const _hm = v => { const m=String(v||'').match(/^(\d{1,2}):(\d{2})$/); return m ? Number(m[1])*60+Number(m[2]) : null; };
      const _scheduleStart = _hm(_sh.scheduleStart || emp.scheduleStart) ?? 480;
      const _shiftEnd = _hm(_sh.scheduleEnd || emp.scheduleEnd) ?? 1020;
      const _lunchStart = _hm(_sh.lunchStart || emp.lunchStart) ?? 720;
      const _lunchEnd = _hm(_sh.lunchEnd || emp.lunchEnd) ?? 780;
      const _nowMin = _n.getHours()*60+_n.getMinutes();
      const EARLY_CLOCK_IN_MINUTES = 30;
      const LUNCH_WINDOW_EARLY_MINUTES = 5;
      const LUNCH_WINDOW_LATE_MINUTES = 30;
      const has = field => _rec && !isBlank(_rec[field]);
      const hasAmIn = has('timeIn'), hasAmOut = has('timeOut'), hasPmIn = has('timeIn2'), hasPmOut = has('timeOut2');
      let action;

      // AM Time In is accepted only from 30 minutes before the assigned start until the AM lunch window.
      // The PM Time In window remains available even if an employee missed an AM punch.
      if (hasPmIn && !hasPmOut) {
        action = 'PM OUT';
      } else if (hasPmOut) {
        alert(`${emp.name}: all four attendance punches are already recorded today.`);
        return;
      } else if (_nowMin >= _lunchEnd - LUNCH_WINDOW_EARLY_MINUTES && _nowMin <= _lunchEnd + LUNCH_WINDOW_LATE_MINUTES) {
        if (!hasPmIn) action = 'PM IN';
      } else if (_nowMin >= _lunchStart - LUNCH_WINDOW_EARLY_MINUTES && _nowMin <= _lunchStart + LUNCH_WINDOW_LATE_MINUTES) {
        if (hasAmIn && !hasAmOut) action = 'AM OUT';
      } else if (!hasAmIn && !hasAmOut && !hasPmIn && !hasPmOut && _nowMin >= _scheduleStart - EARLY_CLOCK_IN_MINUTES && _nowMin < _lunchStart - LUNCH_WINDOW_EARLY_MINUTES) {
        action = 'AM IN';
      }

      if (!action) {
        if (_nowMin < _scheduleStart - EARLY_CLOCK_IN_MINUTES) {
          alert(`${emp.name}: too early to clock in. Your earliest allowed AM Time In is ${new Date(_n.getFullYear(), _n.getMonth(), _n.getDate(), Math.floor(_scheduleStart / 60), _scheduleStart % 60 - EARLY_CLOCK_IN_MINUTES).toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'})}.`);
        } else if (!hasAmOut && _nowMin > _lunchStart + LUNCH_WINDOW_LATE_MINUTES && _nowMin < _lunchEnd - LUNCH_WINDOW_EARLY_MINUTES) {
          alert(`${emp.name}: the AM Time Out window has passed. Please submit a Manual Attendance Request for the missing tap.`);
        } else if (!hasPmIn && _nowMin > _lunchEnd + LUNCH_WINDOW_LATE_MINUTES) {
          alert(`${emp.name}: the PM Time In window has passed. Please submit a Manual Attendance Request for the missing tap.`);
        } else if (!hasAmIn && _nowMin >= _lunchStart - LUNCH_WINDOW_EARLY_MINUTES && _nowMin < _lunchEnd - LUNCH_WINDOW_EARLY_MINUTES) {
          alert(`${emp.name}: the AM Time In window has passed. Please submit a Manual Attendance Request for the missing tap.`);
        } else if (_nowMin < _lunchStart - LUNCH_WINDOW_EARLY_MINUTES && hasAmIn && !hasAmOut) {
          alert(`${emp.name}: too early for AM Time Out. The lunch tap window opens 5 minutes before your scheduled lunch break.`);
        } else if (_nowMin < _lunchEnd - LUNCH_WINDOW_EARLY_MINUTES && hasAmOut && !hasPmIn) {
          alert(`${emp.name}: too early for PM Time In. The tap window opens 5 minutes before your scheduled lunch break ends.`);
        } else {
          alert(`${emp.name}: no attendance tap is available at this time. Check your schedule or submit a Manual Attendance Request if you missed a tap.`);
        }
        return;
      }
      if (_rec && Date.now() - (_rec._ts || 0) < 60000) { alert("Wait 1 minute before the next tap."); return; }

      // kuhanan agad ng picture sa mismong tap
      const shot = capturePhoto();
      if (!shot && REQUIRE_PHOTO) {
        alert("Camera required. Press Enable reader first.");
        return;
      }

      const now = new Date();
      const todayStr = _today;
      const timeStr = now.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const toMin = v => { const m = String(v || '').match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i); return m ? ((Number(m[1]) % 12) + (m[3].toUpperCase() === 'PM' ? 12 : 0)) * 60 + Number(m[2]) : null; };
      const GRACE = Math.max(0, Number(_sh.graceMinutes ?? emp.graceMinutes ?? 15)), AM_START = _scheduleStart, PM_START = _lunchEnd, SHIFT_END = _shiftEnd;

      let record = _rec || {
        date: todayStr, empId: emp.id, name: emp.name,
        timeIn: "--", timeOut: "--", timeIn2: "--", timeOut2: "--",
        lateMinutes: 0, renderedHours: 0, overtimeHours: 0, status: "",
        photoIn: null, photoOut: null, photoIn2: null, photoOut2: null,
        photoProof: emp.photoUrl   // profile photo, fallback lang
      };
      record.v = 2;
      let status = "On-Time";

      if (action === "AM IN") {
        record.timeIn = timeStr;
        const late = nowMin > AM_START + GRACE ? nowMin - AM_START : 0;
        record.lateMinutes = late;
        status = late ? `Late (${late}m)` : "On-Time";
      } else if (action === "AM OUT") {
        record.timeOut = timeStr;
        status = "Lunch Break";
      } else if (action === "PM IN") {
        record.timeIn2 = timeStr;
        const late = nowMin > PM_START + GRACE ? nowMin - PM_START : 0;
        record.lateMinutes = Number(record.lateMinutes || 0) + late;
        status = late ? `Late (${late}m)` : "In progress";
      } else {
        record.timeOut2 = timeStr;
        status = nowMin >= SHIFT_END ? "Completed" : "Early Out";
        if (nowMin > SHIFT_END) {
          record.overtimeHours = Math.round((nowMin - SHIFT_END) / 60 * 100) / 100;
          status = `Completed (+${record.overtimeHours}h OT)`;
        }
      }
      // rendered hours = AM session + PM session (the lunch gap between them is not counted)
      const sess = (i, o) => { const a = toMin(i), b = toMin(o); return a !== null && b !== null && b > a ? b - a : 0; };
      record.renderedHours = Math.round((sess(record.timeIn, record.timeOut) + sess(record.timeIn2, record.timeOut2)) / 60 * 100) / 100;
      record.status = status;

      // i-upload ang picture, tapos ilagay ang path sa record
      const stamp = now.getHours().toString().padStart(2, "0") + now.getMinutes().toString().padStart(2, "0") + now.getSeconds().toString().padStart(2, "0");
      const fname = `${todayStr}_${emp.id}_${action.replace(" ", "-")}_${stamp}.jpg`;
      let savedPath = null;
      if (shot) {
        savedPath = await uploadPhoto(shot, fname);
        if (!savedPath && REQUIRE_PHOTO) {
          alert("Photo upload failed. Tap again.");
          return;
        }
      }
      const photoKey = { "AM IN": "photoIn", "AM OUT": "photoOut", "PM IN": "photoIn2", "PM OUT": "photoOut2" }[action];
      record[photoKey] = savedPath;
      record.photoProof = savedPath || record.photoIn || record.photoProof;

      // I-save sa local at ipadala agad sa /api/v1/sync server
      PMSStore.saveDTRRecord(record);
      // Success on screen must mean "the server has it", not just "saved on this phone".
      const savedOnServer = PMSStore.flushToServer(6000).then(() => true, () => false);

      const targetBox = document.getElementById("kioskBox");
      const idle = document.getElementById("idleDisplay");
      const verify = document.getElementById("verifyDisplay");

      document.getElementById("empVerifyName").innerText = emp.name;
      document.getElementById("empVerifyRole").innerText = `${emp.role} (${emp.id})`;
      document.getElementById("empVerifyImg").src = shot || emp.photoUrl;

      const actBadge = document.getElementById("empVerifyActionBadge");
      const isIn = action.endsWith("IN");
      const actLabel = action.replace("IN", "In").replace("OUT", "Out");
      actBadge.className = isIn ? "badge bg-success fs-6" : "badge bg-warning text-dark fs-6";
      actBadge.innerText = `${actLabel} ${timeStr}`;

      const statBadge = document.getElementById("empVerifyStatusBadge");
      statBadge.className = status.includes("Late") ? "badge bg-danger fs-6" : "badge bg-secondary fs-6";
      statBadge.innerText = status;

      targetBox.className = `scan-target ${isIn ? 'state-in' : 'state-out'}`;
      const successCard = document.getElementById('kioskSuccessCard');
      const $s = id => document.getElementById(id);
      const tok = (successCard._tok = (successCard._tok || 0) + 1);   // so an older tap can't hide/update a newer one
      successCard.className = 'ks-overlay ' + (isIn ? 'ks-in' : 'ks-out');
      const ksBadge = successCard.querySelector('.ks-badge');
      ksBadge.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      $s('ksPhoto').src = shot || emp.photoUrl || '';
      $s('ksName').textContent = emp.name;
      $s('ksMeta').textContent = [emp.id, emp.role].filter(Boolean).join(' · ');
      $s('ksAction').textContent = `${action.slice(0, 2)} ${isIn ? 'Time In' : 'Time Out'}`;
      $s('ksTime').textContent = timeStr;
      const ksStatus = $s('ksStatus');
      ksStatus.textContent = status;
      ksStatus.className = 'ks-pill ' + (/Late/i.test(status) ? 'ks-late' : /Early/i.test(status) ? 'ks-warn' : 'ks-ok');
      $s('ksDate').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      const ksSync = $s('ksSync');
      ksSync.className = 'ks-sync ks-saving';
      ksSync.innerHTML = '<span class="ks-spin"></span>Saving...';
      idle.classList.remove("d-none");
      verify.classList.add("d-none");

      const hideNow = () => {
        targetBox.className = "scan-target";
        successCard.classList.add('d-none');
        const buf = document.getElementById("kioskScanBuffer");
        buf.value = "";
        buf.focus();
      };
      successCard.onclick = hideNow;   // tap the screen to dismiss
      const minShow = new Promise(r => setTimeout(r, 3500));
      savedOnServer.then(ok => {
        if (successCard._tok !== tok) return;
        if (ok) { ksSync.className = 'ks-sync ks-saved'; ksSync.innerHTML = '<i class="bi bi-cloud-check-fill"></i>Saved'; }
        else {
          successCard.classList.add('ks-unsynced');
          ksBadge.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5v7M12 17.4v.1"/></svg>';
          ksSync.className = 'ks-sync ks-failed'; ksSync.innerHTML = '<i class="bi bi-cloud-slash-fill"></i>Saved on device. Will sync when online';
        }
        minShow.then(() => setTimeout(() => { if (successCard._tok === tok) hideNow(); }, ok ? 0 : 5000));
      });
      successCard.classList.remove('d-none');

    }

    const scanBuffer = document.getElementById("kioskScanBuffer");
    scanBuffer.addEventListener("keypress", (e) => {
      if (e.key === "Enter" && scanBuffer.value) {
        executePunch(scanBuffer.value);
      }
    });

    document.getElementById("btnManualSubmit").addEventListener("click", () => {
      if (scanBuffer.value) executePunch(scanBuffer.value);
    });

    // Web NFC Reader para sa Phone
    document.getElementById("btnEnableNfc").addEventListener("click", async () => {
      startCamera();
      const statusEl = document.getElementById("nfcLiveStatus");
      if ('NDEFReader' in window) {
        try {
          const ndef = new NDEFReader();
          await ndef.scan();
          statusEl.style.color = "#5fd0a0";
          statusEl.innerText = "Reader on";
          ndef.onreadingerror = () => { statusEl.style.color = "#ff8a8a"; statusEl.innerText = "Card unreadable."; };
          ndef.onreading = event => {
            if (!event.serialNumber) { statusEl.style.color = "#ff8a8a"; statusEl.innerText = "No serial number on card."; return; }
            executePunch(event.serialNumber);
          };
        } catch (err) {
          statusEl.style.color = "#ff8a8a";
          statusEl.innerText = "Reader error: " + err.message;
        }
      } else {
        statusEl.style.color = "#e8c15a";
        statusEl.innerText = "NFC not available. Type the UID.";
      }
    });

    // Live Sync Polling bawat 1.5s
    setInterval(() => {
      PMSStore.pullFromServer();
    }, 1500);

    PMSStore.pullFromServer();
  </script>
</body>
</html>
